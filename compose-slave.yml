name: bento-slave

x-base-environment: &base-environment
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_URL: ${S3_URL}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  RUST_LOG: ${RUST_LOG}
  RUST_BACKTRACE: ${RUST_BACKTRACE}
  RISC0_HOME: /usr/local/risc0

x-agent-common: &agent-common
  runtime: nvidia
  build:
    context: .
    dockerfile: ${AGENT_DOCKERFILE:-dockerfiles/agent.prebuilt.dockerfile}
    args:
      BINARY_URL: ${BENTO_BINARY_URL:-https://github.com/boundless-xyz/boundless/releases/download/bento-v0.14.0/bento-bundle-linux-amd64.tar.gz}
  cpus: 4
  mem_limit: 32G
  environment:
    <<: *base-environment

services:
  gpu_prove_agent2:
    <<: *agent-common
    mem_limit: 32G
    cpus: 8
    entrypoint: /app/agent -t prove --redis-ttl ${REDIS_TTL:-57600}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  gpu_prove_agent3:
    <<: *agent-common
    mem_limit: 32G
    cpus: 8
    entrypoint: /app/agent -t prove --redis-ttl ${REDIS_TTL:-57600}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
